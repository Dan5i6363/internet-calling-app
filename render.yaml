services:
  - type: web
    name: voipify-calling-app
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ENABLE_REAL_PSTN_CALLS
        value: "false"
      - key: NEXT_PUBLIC_STUN_SERVERS
        value: "stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302"
      # Neon.tech Free Tier PostgreSQL connection string (Recommended: persistent, doesn't expire in 30 days)
      # e.g., postgresql://[user]:[password]@[endpoint].neon.tech/[dbname]?sslmode=require
      # If omitted, application uses zero-setup local file persistence with an explicit warning on /api/health
      - key: DATABASE_URL
        sync: false
